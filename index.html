<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Menü</title>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"
    ></script>
    <style>
      body {
        margin: 0;
        padding: 20px 0;
        background: #18181b;
        color: #fff;
        font-family: sans-serif;
        text-align: center;
      }
      .menu {
        margin-bottom: 15px;
      }
      .btn {
        padding: 10px 18px;
        margin: 0 5px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 20px;
        border: 1px solid #444;
        background: #27272a;
        color: #fff;
        cursor: pointer;
      }
      .btn.active {
        background: #fff;
        color: #000;
      }
      /* 3D Model Kutusu - Kesin boyutlu */
      .box {
        width: 320px;
        height: 320px;
        max-width: 90vw;
        margin: 0 auto 20px auto;
        background: #27272a;
        border-radius: 20px;
        border: 1px solid #3f3f46;
        overflow: hidden;
      }
      model-viewer {
        width: 100%;
        height: 100%;
      }
      /* Masada Gör Butonu */
      #ar-trigger {
        display: inline-block;
        background: #f97316;
        color: #fff;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 30px;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
      }
      /* Modal */
      #qr-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .modal {
        background: #27272a;
        padding: 24px;
        border-radius: 20px;
        max-width: 300px;
      }
      .modal img {
        width: 180px;
        height: 180px;
        background: #fff;
        padding: 10px;
        border-radius: 12px;
        margin: 15px 0;
      }
      .close-btn {
        background: #3f3f46;
        color: #fff;
        border: none;
        padding: 8px 20px;
        border-radius: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Ürün Butonları -->
    <div class="menu">
      <button class="btn active" id="b1" onclick="changeItem('urun1')">
        Hamburger
      </button>
      <button class="btn" id="b2" onclick="changeItem('urun2')">Pizza</button>
    </div>

    <!-- Model Kutusu -->
    <div class="box">
      <model-viewer
        id="mv"
        src="assets/urun1.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        rotation-per-second="30deg"
        shadow-intensity="1"
      >
      </model-viewer>
    </div>

    <!-- Masada Gör -->
    <button id="ar-trigger" onclick="handleAR()">Masada Gör</button>

    <!-- QR Popup -->
    <div id="qr-overlay" onclick="closeQR(event)">
      <div class="modal">
        <h3 id="qr-name">Hamburger</h3>
        <p style="font-size: 13px; color: #a1a1aa">QR kodu telefonunla okut:</p>
        <img id="qr-pic" src="" alt="QR" />
        <br />
        <button
          class="close-btn"
          onclick="document.getElementById('qr-overlay').style.display = 'none'"
        >
          Kapat
        </button>
      </div>
    </div>

    <script>
      const mv = document.getElementById("mv");
      let current = "urun1";

      const items = {
        urun1: { name: "Hamburger", path: "assets/urun1.glb" },
        urun2: { name: "Pizza", path: "assets/urun2.glb" },
      };

      // Model yükleme hatasını yakala ve ekranda bildir
      mv.addEventListener("error", (event) => {
        console.error("Model yükleme hatası:", event);
        alert(
          "Model yüklenemedi! Dosya yolu: " +
            mv.getAttribute("src") +
            " bulunamadı (404). Klasör adını ve GLB adını kontrol et.",
        );
      });

      function changeItem(key) {
        current = key;
        mv.setAttribute("src", items[key].path);
        document
          .getElementById("b1")
          .classList.toggle("active", key === "urun1");
        document
          .getElementById("b2")
          .classList.toggle("active", key === "urun2");
      }

      function handleAR() {
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile) {
          mv.activateAR();
          return;
        }

        const overlay = document.getElementById("qr-overlay");
        const qrPic = document.getElementById("qr-pic");
        document.getElementById("qr-name").innerText =
          items[current].name + " Masada Gör";

        const url = new URL(window.location.href);
        url.searchParams.set("item", current);

        qrPic.src =
          "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
          encodeURIComponent(url.toString());
        overlay.style.display = "flex";
      }

      function closeQR(e) {
        if (e.target.id === "qr-overlay") {
          document.getElementById("qr-overlay").style.display = "none";
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        const p = new URLSearchParams(window.location.search).get("item");
        if (p && items[p]) changeItem(p);
      });
    </script>
  </body>
</html>
